name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'explore/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # 不取消进行中的运行，保证每次推送都能完成部署并创建对应 Release。
  cancel-in-progress: false

env:
  # 自定义域名时，在仓库 Settings -> Secrets and variables -> Actions
  # 添加变量 BASE_PATH=/；普通项目站点留空即可自动推导。
  BASE_PATH: ${{ vars.BASE_PATH }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # 仓库变量 RELAY_URL 会内置成默认中继地址，例如 wss://relay.example.com/ws
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
        run: npm run build

      - name: Package release
        run: cd dist && zip -r ../4link-dist.zip .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4link-dist
          path: 4link-dist.zip
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 实验分支只跑构建 / 测试，不覆盖线上 Pages。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build, deploy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: 4link-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}-build.${{ github.run_number }}"
          TITLE="v${{ steps.pkg.outputs.version }} build ${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" 4link-dist.zip --clobber
          else
            gh release create "$TAG" 4link-dist.zip \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --generate-notes
          fi

