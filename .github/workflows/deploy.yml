name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'explore/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # 不取消进行中的运行，保证每次推送都能完成部署并创建对应 Release。
  cancel-in-progress: false

env:
  # 自定义域名时，在仓库 Settings -> Secrets and variables -> Actions
  # 添加变量 BASE_PATH=/；普通项目站点留空即可自动推导。
  BASE_PATH: ${{ vars.BASE_PATH }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # 仓库变量 RELAY_URL 会内置成默认中继地址，例如 wss://relay.example.com/ws
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
        run: npm run build

      - name: Package release
        run: cd dist && zip -r ../4link-dist.zip .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4link-dist
          path: 4link-dist.zip
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 实验分支只跑构建 / 测试，不覆盖线上 Pages。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        # v3 默认安装已被 Google 移除的 `tools` 包，会直接失败；
        # v4 只装 platform-tools，SDK 平台在下一步显式安装。
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:app

      - name: Sync Capacitor
        run: npx cap sync android

      # 仓库 Secrets 里配置签名密钥后即可产出固定签名的 APK，可覆盖安装升级；
      # 未配置时用一次性密钥签名，APK 仍可直接安装，但升级前需要先卸载旧版。
      - name: Prepare signing key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/4link-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/4link-release.jks" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/4link-debug.jks" \
              -storepass 4linkdebug -alias 4link -keypass 4linkdebug \
              -dname "CN=4Link, O=4Link, C=CN" \
              -keyalg RSA -keysize 2048 -validity 10000
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/4link-debug.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=4linkdebug"
              echo "ANDROID_KEY_ALIAS=4link"
              echo "ANDROID_KEY_PASSWORD=4linkdebug"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/4Link-${VERSION}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4link-android
          path: out/*.apk
          retention-days: 7

  desktop:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:app

      - name: Build Windows apps
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable nsis

      - name: Upload Windows apps
        uses: actions/upload-artifact@v4
        with:
          name: 4link-desktop
          path: |
            release/*-portable.exe
            release/*-setup.exe
          retention-days: 7

  release:
    needs: [build, deploy, android, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: 4link-dist

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: 4link-android
          path: android-apk

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: 4link-desktop
          path: desktop-app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}-build.${{ github.run_number }}"
          TITLE="v${{ steps.pkg.outputs.version }} build ${{ github.run_number }}"
          FILES=(4link-dist.zip android-apk/*.apk desktop-app/*.exe)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --generate-notes
          fi

